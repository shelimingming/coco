<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="可可｜连接异地银发家庭的 AI 关怀助手。记住生活小事、提醒重要事项、看清眼前问题、连接远方家人。">
  <title>可可｜连接异地银发家庭的 AI 关怀助手</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    /* 色值对齐 DESIGN：深中性正文、暖米色底；主色只作小标记，不当大标题字 */
    :root {
      --bg: #f3efe9;
      --cream: #fff8ed;
      --ink: #26231f;
      --muted: #5d574f;
      --line: #cfc8be;
      --parent: #c85f36;
      --child: #28786b;
      --shadow: rgba(38, 35, 31, 0.1);
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      /* 不用 height:100%，避免 iOS 上 flex 子项把滚动锁在视口内 */
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background:
        radial-gradient(1200px 560px at 12% -8%, var(--cream) 0%, transparent 58%),
        radial-gradient(900px 420px at 92% 0%, #e6f2f0 0%, transparent 52%),
        var(--bg);
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC",
        "Microsoft YaHei", sans-serif;
    }

    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: clamp(16px, 2.4vw, 28px) clamp(20px, 3vw, 40px) 24px;
      gap: var(--space-6);
      touch-action: pan-y;
    }

    /* 左标题 + 能力句，右演示说明 */
    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--space-4) var(--space-8);
      align-items: start;
      padding-bottom: var(--space-5);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      min-width: 0;
    }

    h1 {
      margin: 0;
      display: flex;
      flex-wrap: nowrap;
      align-items: baseline;
      font-size: clamp(1.25rem, 1rem + 0.8vw, 1.5rem);
      font-weight: 700;
      line-height: 1.35;
    }

    .mark {
      letter-spacing: 0.12em;
    }

    .sep {
      margin: 0 0.4em;
      font-weight: 400;
      color: var(--muted);
    }

    .position {
      font-size: 0.95em;
      font-weight: 500;
    }

    .caps {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.6;
      letter-spacing: 0.02em;
    }

    .caps li {
      display: flex;
      align-items: baseline;
    }

    .caps li:not(:last-child)::after {
      content: "·";
      margin: 0 0.7em;
      color: var(--line);
      font-weight: 400;
    }

    .note {
      margin: 0;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.5;
      text-align: right;
      padding-top: 6px;
    }

    .note .wechat-tip {
      display: block;
      margin-top: 4px;
    }

    .stage {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-6);
      min-height: 0;
      align-items: stretch;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      min-width: 0;
      min-height: 0;
    }

    .label {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
    }

    .dot.parent { background: var(--parent); }
    .dot.child { background: var(--child); }

    /* iframe 只做屏幕槽；iPhone 外框由 Flutter 在 presentation_slot 下强制绘制 */
    .device {
      position: relative;
      flex: 1;
      min-height: 520px;
      min-width: 0;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .frame {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      width: 100%;
      border: 0;
      background: transparent;
      /* 未就绪前隐藏，避免 iframe 默认白底闪一下 */
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .frame.is-ready {
      opacity: 1;
    }

    /* iframe 就绪前占位：轻柔呼吸圆 + 文案，对齐 DESIGN 暖色气质 */
    .device-loading {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-4);
      border-radius: 28px;
      background: rgba(255, 248, 237, 0.55);
      pointer-events: none;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .device-loading.is-done {
      opacity: 0;
      visibility: hidden;
    }

    .device-loading[data-role="child"] {
      background: rgba(246, 248, 247, 0.65);
    }

    .device-loading .breath {
      width: 56px;
      height: 56px;
      border-radius: 999px;
      background: var(--parent);
      opacity: 0.85;
      animation: coco-breath 1.6s ease-in-out infinite;
    }

    .device-loading[data-role="child"] .breath {
      background: var(--child);
    }

    .device-loading .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    @keyframes coco-breath {
      0%, 100% { transform: scale(0.88); opacity: 0.45; }
      50% { transform: scale(1); opacity: 0.95; }
    }

    @media (prefers-reduced-motion: reduce) {
      .device-loading .breath { animation: none; opacity: 0.75; }
      .frame { transition: none; }
      .device-loading { transition: none; }
    }

    @media (max-width: 800px) {
      .page {
        padding: 16px 20px 20px;
        gap: 16px;
      }

      header {
        grid-template-columns: 1fr;
        gap: 10px;
        padding-bottom: 14px;
      }

      /* 窄屏标题锁同一行，字号随宽度缩小，避免「可可｜」单独换行 */
      h1 {
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: baseline;
        font-size: clamp(0.8125rem, 3.7vw, 1.0625rem);
        white-space: nowrap;
      }

      .sep {
        display: inline;
        margin: 0 0.28em;
      }

      .mark {
        flex-shrink: 0;
        font-size: 1.12em;
        letter-spacing: 0.06em;
      }

      .position {
        font-size: 1em;
        font-weight: 500;
        color: var(--muted);
      }

      /* 四项能力两列左对齐，不要撑满宽导致中间一块空 */
      .caps {
        display: grid;
        grid-template-columns: max-content max-content;
        justify-content: start;
        gap: 8px 28px;
        margin-top: 12px;
        font-size: 0.8125rem;
      }

      .caps li:not(:last-child)::after {
        content: none;
        margin: 0;
      }

      .note {
        text-align: left;
        padding-top: 0;
        font-size: 0.6875rem;
      }

      .stage {
        grid-template-columns: 1fr;
        flex: none;
      }

      /*
       * iframe 收窄为真机框宽度（对齐 WebIphoneShell.deviceSize 413×872），
       * 左右留白落在 iframe 外的 .device 上，触摸才能滚动整页。
       */
      .device {
        min-height: 0;
        height: auto;
        justify-content: center;
        align-items: center;
        touch-action: pan-y;
      }

      .frame {
        flex: none;
        /* 宽高一起算，避免 max-height 压扁后在 iframe 内又出现左右死区 */
        width: min(
          calc(100vw - 40px),
          413px,
          calc(72vh * 413 / 872)
        );
        aspect-ratio: 413 / 872;
        height: auto;
        border: 0;
      }
    }
  </style>
</head>
<body>
  <!-- 同域双 iframe + presentation_slot，登录态写入隔离的 localStorage key -->
  <div class="page">
    <header>
      <div class="brand">
        <h1>
          <span class="mark">可可</span><span class="sep" aria-hidden="true">｜</span><span class="position">连接异地银发家庭的 AI 关怀助手</span>
        </h1>
        <ul class="caps">
          <li>记住生活小事</li>
          <li>提醒重要事项</li>
          <li>看清眼前问题</li>
          <li>连接远方家人</li>
        </ul>
      </div>
      <p class="note">
        网页仅供演示 · 完整功能请用 APP
        <span class="wechat-tip">微信浏览器打开如果白屏，请使用默认浏览器打开</span>
      </p>
    </header>
    <div class="stage">
      <section class="panel" aria-label="长辈端">
        <div class="label"><span class="dot parent" aria-hidden="true"></span>长辈端</div>
        <div class="device">
          <div class="device-loading" data-role="parent" role="status" aria-live="polite">
            <span class="breath" aria-hidden="true"></span>
            <p class="hint">正在加载长辈端…</p>
          </div>
          <iframe
            class="frame"
            title="长辈端"
            data-slot="parent"
            src="./index.html?presentation_slot=parent"
            allow="microphone; autoplay; clipboard-write"
          ></iframe>
        </div>
      </section>
      <section class="panel" aria-label="子女端">
        <div class="label"><span class="dot child" aria-hidden="true"></span>子女端</div>
        <div class="device">
          <div class="device-loading" data-role="child" role="status" aria-live="polite">
            <span class="breath" aria-hidden="true"></span>
            <p class="hint">正在加载子女端…</p>
          </div>
          <iframe
            class="frame"
            title="子女端"
            data-slot="child"
            src="./index.html?presentation_slot=child"
            allow="microphone; autoplay; clipboard-write"
          ></iframe>
        </div>
      </section>
    </div>
  </div>
  <script>
    // iframe HTML 到齐后淡入；引擎首帧由 index.html 内加载层承接
    document.querySelectorAll('.frame').forEach(function (frame) {
      frame.addEventListener('load', function () {
        frame.classList.add('is-ready');
        var loading = frame.parentElement && frame.parentElement.querySelector('.device-loading');
        if (loading) loading.classList.add('is-done');
      });
    });
  </script>
</body>
</html>
