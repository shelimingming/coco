<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="可可｜连接异地银发家庭的 AI 关怀助手。记住生活小事、提醒重要事项、看清眼前问题、连接远方家人。">
  <title>可可｜连接异地银发家庭的 AI 关怀助手</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    /* 色值对齐 DESIGN：深中性正文、暖米色底；主色只作小标记，不当大标题字 */
    :root {
      --bg: #f3efe9;
      --cream: #fff8ed;
      --ink: #26231f;
      --muted: #5d574f;
      --line: #cfc8be;
      --parent: #c85f36;
      --child: #28786b;
      --frame: #ffffff;
      --shadow: rgba(38, 35, 31, 0.1);
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(1200px 560px at 12% -8%, var(--cream) 0%, transparent 58%),
        radial-gradient(900px 420px at 92% 0%, #e6f2f0 0%, transparent 52%),
        var(--bg);
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC",
        "Microsoft YaHei", sans-serif;
    }

    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: clamp(16px, 2.4vw, 28px) clamp(20px, 3vw, 40px) 24px;
      gap: var(--space-6);
    }

    /* 左标题 + 能力句，右演示说明 */
    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--space-4) var(--space-8);
      align-items: start;
      padding-bottom: var(--space-5);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      min-width: 0;
    }

    h1 {
      margin: 0;
      display: flex;
      flex-wrap: nowrap;
      align-items: baseline;
      font-size: clamp(1.25rem, 1rem + 0.8vw, 1.5rem);
      font-weight: 700;
      line-height: 1.35;
    }

    .mark {
      letter-spacing: 0.12em;
    }

    .sep {
      margin: 0 0.4em;
      font-weight: 400;
      color: var(--muted);
    }

    .position {
      font-size: 0.95em;
      font-weight: 500;
    }

    .caps {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.6;
      letter-spacing: 0.02em;
    }

    .caps li {
      display: flex;
      align-items: baseline;
    }

    .caps li:not(:last-child)::after {
      content: "·";
      margin: 0 0.7em;
      color: var(--line);
      font-weight: 400;
    }

    .note {
      margin: 0;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.5;
      text-align: right;
      padding-top: 6px;
    }

    .stage {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-6);
      min-height: 0;
      align-items: stretch;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      min-width: 0;
      min-height: 0;
    }

    .label {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
    }

    .dot.parent { background: var(--parent); }
    .dot.child { background: var(--child); }

    .frame {
      flex: 1;
      min-height: 520px;
      border: 0;
      border-radius: 20px;
      background: var(--frame);
      box-shadow: 0 18px 40px var(--shadow);
      overflow: hidden;
    }

    @media (max-width: 800px) {
      .page {
        padding: 16px 20px 20px;
        gap: 16px;
      }

      header {
        grid-template-columns: 1fr;
        gap: 10px;
        padding-bottom: 14px;
      }

      /* 窄屏标题锁同一行，字号随宽度缩小，避免「可可｜」单独换行 */
      h1 {
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: baseline;
        font-size: clamp(0.8125rem, 3.7vw, 1.0625rem);
        white-space: nowrap;
      }

      .sep {
        display: inline;
        margin: 0 0.28em;
      }

      .mark {
        flex-shrink: 0;
        font-size: 1.12em;
        letter-spacing: 0.06em;
      }

      .position {
        font-size: 1em;
        font-weight: 500;
        color: var(--muted);
      }

      /* 四项能力两列左对齐，不要撑满宽导致中间一块空 */
      .caps {
        display: grid;
        grid-template-columns: max-content max-content;
        justify-content: start;
        gap: 8px 28px;
        margin-top: 12px;
        font-size: 0.8125rem;
      }

      .caps li:not(:last-child)::after {
        content: none;
        margin: 0;
      }

      .note {
        text-align: left;
        padding-top: 0;
        font-size: 0.6875rem;
      }

      .stage {
        grid-template-columns: 1fr;
      }

      .frame {
        min-height: 560px;
        height: 72vh;
      }
    }
  </style>
</head>
<body>
  <!-- 同域双 iframe + presentation_slot，登录态写入隔离的 localStorage key -->
  <div class="page">
    <header>
      <div class="brand">
        <h1>
          <span class="mark">可可</span><span class="sep" aria-hidden="true">｜</span><span class="position">连接异地银发家庭的 AI 关怀助手</span>
        </h1>
        <ul class="caps">
          <li>记住生活小事</li>
          <li>提醒重要事项</li>
          <li>看清眼前问题</li>
          <li>连接远方家人</li>
        </ul>
      </div>
      <p class="note">网页仅供演示 · 完整功能请用 APP</p>
    </header>
    <div class="stage">
      <section class="panel" aria-label="长辈端">
        <div class="label"><span class="dot parent" aria-hidden="true"></span>长辈端</div>
        <iframe
          class="frame"
          title="长辈端"
          src="./index.html?presentation_slot=parent"
          allow="microphone; autoplay; clipboard-write"
        ></iframe>
      </section>
      <section class="panel" aria-label="子女端">
        <div class="label"><span class="dot child" aria-hidden="true"></span>子女端</div>
        <iframe
          class="frame"
          title="子女端"
          src="./index.html?presentation_slot=child"
          allow="microphone; autoplay; clipboard-write"
        ></iframe>
      </section>
    </div>
  </div>
</body>
</html>
